name: DeathBan
version: 1.0.0
main: com.yourserver.deathban.DeathBan
api-version: '1.21'
author: YourServer
description: Escalating death-ban system for semi-hardcore SMP
 
commands:
  deathban:
    description: Manage death counts and bans
    usage: /deathban <check|set|reset|revive> <player> [count]
    permission: deathban.admin
 
permissions:
  deathban.bypass:
    description: Exempts player from death bans (admins/showrunners)
    default: op
  deathban.admin:
    description: Allows use of /deathban admin commands
    default: op
