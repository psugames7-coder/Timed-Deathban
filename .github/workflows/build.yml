name: Build Plugin

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Find pom and build
        run: |
          POM_DIR=$(dirname "$(find . -name pom.xml | head -1)")
          echo "Building in: $POM_DIR"
          cd "$POM_DIR"
          mvn clean package
          echo "=== Built jars ==="
          ls -la target/

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeathBan-plugin
          path: '**/target/*.jar'
          
