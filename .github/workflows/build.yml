name: Build Plugin

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean package
        working-directory: DeathBan-source_1

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeathBan-plugin
          path: DeathBan/target/DeathBan-source_1-*.jar
